document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ing:.1em;text-transform:uppercase;color:#9fd9b8;opacity:0.6;\">bio/<\u002Fspan>\n          <p style=\"font-size:15px;line-height:1.8;color:#9fd9b8;opacity:0.85;margin:14px 0 0;max-width:62ch;\">I've spent the last eight years moving between disciplines that don't usually share a desk — game engines, backend services, native apps, and the occasional client website. I like the parts of programming that feel like carpentry: cutting a problem down until only the necessary joints are left. Currently based remote, shipping solo and in small teams.<\u002Fp>\n          <p style=\"font-size:15px;line-height:1.8;color:#9fd9b8;opacity:0.85;margin:16px 0 0;max-width:62ch;\">Outside of client work I keep a running log of side projects — most don't ship, a few do. Driftwake, on the work tab, is the one I'm proudest of.<\u002Fp>\n          <p style=\"font-size:15px;line-height:1.8;color:#9fd9b8;opacity:0.85;margin:16px 0 0;max-width:62ch;\">I work best on small teams with short feedback loops — a spec on a napkin beats a spec in a doc most days. If a project needs a second set of hands, I've got a short list of collaborators for design, audio and QA.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <span style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#9fd9b8;opacity:0.6;\">skills/<\u002Fspan>\n          <div style=\"margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);border:1px solid color-mix(in srgb, var(--acc) 30%, transparent);background:#050705;font-size:12.5px;\">\n            <div style=\"padding:10px 14px;border-right:1px solid color-mix(in srgb, var(--acc) 22%, transparent);border-bottom:1px solid color-mix(in srgb, var(--acc) 30%, transparent);letter-spacing:.05em;\">LANGUAGES<\u002Fdiv>\n            <div style=\"padding:10px 14px;border-right:1px solid color-mix(in srgb, var(--acc) 22%, transparent);border-bottom:1px solid color-mix(in srgb, var(--acc) 30%, transparent);letter-spacing:.05em;\">FRAMEWORKS<\u002Fdiv>\n            <div style=\"padding:10px 14px;border-bottom:1px solid color-mix(in srgb, var(--acc) 30%, transparent);letter-spacing:.05em;\">INFRA<\u002Fdiv>\n            <sc-for list=\"{{ skillRows }}\" as=\"row\" hint-placeholder-count=\"4\">\n              <div style=\"padding:8px 14px;border-right:1px solid color-mix(in srgb, var(--acc) 16%, transparent);color:#dff5e6;opacity:0.9;\">{{ row.a }}<\u002Fdiv>\n              <div style=\"padding:8px 14px;border-right:1px solid color-mix(in srgb, var(--acc) 16%, transparent);color:#dff5e6;opacity:0.9;\">{{ row.b }}<\u002Fdiv>\n              <div style=\"padding:8px 14px;color:#dff5e6;opacity:0.9;\">{{ row.c }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section style=\"padding:8px 0 0;border-top:1px solid color-mix(in srgb, var(--acc) 22%, transparent);\">\n        <span style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#9fd9b8;opacity:0.6;\">education/<\u002Fspan>\n        <pre style=\"font-family:inherit;color:var(--acc);white-space:pre;overflow-x:auto;line-height:1.7;font-size:12.5px;margin:14px 0 0;background:#050705;border:1px solid color-mix(in srgb, var(--acc) 30%, transparent);padding:16px 18px;\">  2014 ─┬─ High School Diploma\n        │   Lincoln Academy\n        │\n  2018 ─┼─ B.S. Computer Science\n        │   State University\n        │\n  2020 ─┴─ M.S. Computer Graphics, Real-Time Rendering\n            State University<\u002Fpre>\n      <\u002Fsection>\n\n      <section style=\"padding:32px 0 56px;border-top:1px solid color-mix(in srgb, var(--acc) 22%, transparent);\">\n        <span style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#9fd9b8;opacity:0.6;\">timeline/<\u002Fspan>\n        <pre style=\"font-family:inherit;color:var(--acc);white-space:pre;overflow-x:auto;line-height:1.7;font-size:12.5px;margin:14px 0 0;background:#050705;border:1px solid color-mix(in srgb, var(--acc) 30%, transparent);padding:16px 18px;\">  2023 ─┬─ now\n        │   Independent — contract software &amp; game dev\n        │\n  2020 ─┼─ 2023\n        │   Senior engineer — backend systems, mid-size startup\n        │\n  2018 ─┴─ 2020\n            App developer — iOS team, agency work<\u002Fpre>\n      <\u002Fsection>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isContact }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"max-width:1000px;margin:0 auto;padding:0 40px 80px;animation:pageIn .4s ease both;\">\n      <section ref=\"{{ contactPromptRef }}\" style=\"padding:56px 0 0;\">\n        <div style=\"position:relative;\">\n          <span aria-hidden=\"true\" style=\"display:block;font-size:15px;visibility:hidden;\">{{ contactPromptFinal }}<\u002Fspan>\n          <span style=\"position:absolute;inset:0;display:block;font-size:15px;color:var(--acc);\">{{ contactPromptText }}<span class=\"caret\"><\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"position:relative;margin-top:12px;\">\n          <h1 aria-hidden=\"true\" class=\"glow\" style=\"font-size:clamp(32px,3.8vw,48px);line-height:1.2;margin:0;max-width:16ch;font-weight:700;visibility:hidden;\">{{ contactTitleFinal }}<\u002Fh1>\n          <h1 ref=\"{{ contactTitleRef }}\" class=\"glow\" style=\"position:absolute;inset:0;font-size:clamp(32px,3.8vw,48px);line-height:1.2;margin:0;max-width:16ch;font-weight:700;\">{{ contactTitleText }}<\u002Fh1>\n        <\u002Fdiv>\n        <p style=\"font-size:15px;line-height:1.7;max-width:52ch;margin:18px 0 0;color:#9fd9b8;opacity:0.85;\">Open to freelance work and interesting collaborations. Fill in the fields below or reach out directly.<\u002Fp>\n      <\u002Fsection>\n\n      <section style=\"display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:28px 56px;padding:36px 0 60px;\">\n        <div class=\"term-card\" style=\"cursor:default;\">\n          <div style=\"display:flex;flex-direction:column;gap:16px;\">\n            <label style=\"display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--acc);\">$ name --input\n              <input type=\"text\" placeholder=\"jane_doe\" class=\"term-input\">\n            <\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--acc);\">$ email --input\n              <input type=\"email\" placeholder=\"jane@doe.com\" class=\"term-input\">\n            <\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--acc);\">$ message --input\n              <textarea rows=\"4\" placeholder=\"describe the project...\" class=\"term-input\" style=\"resize:vertical;\"><\u002Ftextarea>\n            <\u002Flabel>\n            <button type=\"button\" class=\"term-btn solid\" style=\"align-self:flex-start;\" onclick=\"{{ handleSend }}\">{{ sendLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <span style=\"font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#9fd9b8;opacity:0.6;\">direct/<\u002Fspan>\n          <div style=\"display:flex;flex-direction:column;gap:12px;margin-top:14px;\">\n            <a href=\"mailto:hi@avoss.dev\" style=\"font-size:14px;\">$ open mailto:hi@avoss.dev<\u002Fa>\n            <a href=\"#\" style=\"font-size:14px;\">$ open github.com/avoss<\u002Fa>\n            <a href=\"#\" style=\"font-size:14px;\">$ open twitter.com/avoss<\u002Fa>\n          <\u002Fdiv>\n          <div style=\"margin-top:26px;background:#050705;border:1px solid color-mix(in srgb, var(--acc) 30%, transparent);padding:16px 18px;font-size:13px;color:var(--acc);\">\n            $ echo $STATUS<br><span style=\"opacity:0.85;\">&gt; available for freelance, Q4 2026<\u002Fspan><br><br>\n            $ echo $RESPONSE_TIME<br><span style=\"opacity:0.85;\">&gt; usually within 24h, GMT-5<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ lightboxOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;z-index:100;background:rgba(2,4,2,0.6);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;\" onclick=\"{{ closeLightbox }}\">\n      <button type=\"button\" class=\"term-btn\" onclick=\"{{ closeLightbox }}\" style=\"position:absolute;top:24px;right:24px;font-size:13px;\">[ x ] close<\u002Fbutton>\n      <div style=\"display:flex;flex-direction:column;align-items:center;gap:14px;\">\n        <div style=\"display:flex;align-items:center;gap:20px;\">\n          <sc-if value=\"{{ lightboxShowNav }}\" hint-placeholder-val=\"{{ false }}\">\n            <button type=\"button\" class=\"term-btn\" onclick=\"{{ prevMediaClick }}\" style=\"font-size:16px;padding:10px 14px;\">&lt;<\u002Fbutton>\n          <\u002Fsc-if>\n          <div style=\"width:min(900px,76vw);max-height:74vh;aspect-ratio:16/10;border:1px solid color-mix(in srgb, var(--acc) 45%, transparent);box-shadow:0 0 60px color-mix(in srgb, var(--acc) 25%, transparent);\" onclick=\"event.stopPropagation()\">\n            <image-slot id=\"{{ lightboxId }}\" shape=\"rect\" placeholder=\"Drop an image\" style=\"width:100%;height:100%;\"><\u002Fimage-slot>\n          <\u002Fdiv>\n          <sc-if value=\"{{ lightboxShowNav }}\" hint-placeholder-val=\"{{ false }}\">\n            <button type=\"button\" class=\"term-btn\" onclick=\"{{ nextMediaClick }}\" style=\"font-size:16px;padding:10px 14px;\">&gt;<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <sc-if value=\"{{ lightboxShowNav }}\" hint-placeholder-val=\"{{ false }}\">\n          <span style=\"font-size:12px;color:var(--acc);letter-spacing:.05em;\">{{ mediaLabel }}<\u002Fspan>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <\u002Fsc-if>\n\n  \n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;introIntervalMs&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:3600,&quot;min&quot;:800,&quot;max&quot;:5000,&quot;step&quot;:100,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Intro sequence&quot;},&quot;fisheyeIntensity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:4,&quot;min&quot;:0,&quot;max&quot;:120,&quot;step&quot;:2,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Intro sequence&quot;},&quot;fadeTopStart&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.42,&quot;min&quot;:0.1,&quot;max&quot;:0.95,&quot;step&quot;:0.02,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Intro sequence&quot;},&quot;previewBoxRatio&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.375,&quot;min&quot;:0.25,&quot;max&quot;:0.8,&quot;step&quot;:0.025,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Intro sequence&quot;},&quot;introOffsetX&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0,&quot;min&quot;:-300,&quot;max&quot;:300,&quot;step&quot;:5,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Intro sequence&quot;,&quot;unit&quot;:&quot;px&quot;},&quot;introOffsetY&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0,&quot;min&quot;:-300,&quot;max&quot;:300,&quot;step&quot;:5,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Intro sequence&quot;,&quot;unit&quot;:&quot;px&quot;}}\">\nconst ACCENTS = { green: \"#33ff99\", amber: \"#ffb000\", cyan: \"#4dd0ff\" };\n\n// Procedurally builds a long, flavor-plausible boot log (~500 lines) so\n// intro.sh reads like a real machine dumping init logs before it gets to\n// the actual \"loading projects\" section.\nfunction buildBootLog() {\n  const modules = [\"nvme\", \"usbcore\", \"ext4\", \"overlayfs\", \"cgroup2\", \"netfilter\", \"tcp_bbr\", \"af_packet\", \"loop\", \"dm_crypt\",\n    \"zram\", \"btrfs\", \"squashfs\", \"acpi_cpufreq\", \"i2c_core\", \"drm_kms\", \"snd_hda\", \"cpufreq_governor\", \"vfat\", \"tmpfs\"];\n  const services = [\"network-manager\", \"systemd-journald\", \"dbus\", \"ssh-agent\", \"cron\", \"avahi-daemon\", \"polkit\", \"udisks2\",\n    \"power-profiles\", \"bluetooth\", \"display-manager\", \"thermald\", \"fwupd\", \"timesyncd\", \"resolved\", \"logind\"];\n  const paths = [\"/dev/sda1\", \"/dev/nvme0n1p2\", \"/home/avoss\", \"/var/cache\", \"/etc/portfolio.conf\", \"/usr/local/bin\", \"/tmp/build\",\n    \"/opt/toolchain\", \"/srv/assets\", \"/mnt/backup\"];\n  const lines = [\"$ boot avoss_os --profile=portfolio\", \"> initializing session...\"];\n  let addr = 0x7f000000;\n  for (let i = 0; i < 480; i++) {\n    const roll = i % 5;\n    if (roll === 0) lines.push(`[  ${(i * 0.0137).toFixed(6).padStart(9, \" \")}] Loading module ${modules[i % modules.length]}... ok`);\n    else if (roll === 1) lines.push(`> starting ${services[i % services.length]}.service... ok`);\n    else if (roll === 2) { addr += 0x1000 * (i % 7 + 1); lines.push(`[  ${(i * 0.0137).toFixed(6).padStart(9, \" \")}] mapped region 0x${addr.toString(16)} (${paths[i % paths.length]})`); }\n    else if (roll === 3) lines.push(`> fsck ${paths[i % paths.length]}: clean, ${(i * 37) % 900 + 100} files, ${(i * 13) % 90 + 10}% used`);\n    else lines.push(`[ok] ${services[(i + 3) % services.length]} :: pid ${1000 + i} :: 0.${(i % 9)}s`);\n  }\n  lines.push(\"> checking kernel modules... ok\", \"> mounting /dev/portfolio...\", \"> verifying user credentials... ok\",\n    \"> loading shell profile: avoss.zshrc\", \"> starting display server...\", \"> network: connected (eth0, 1000 Mb/s)\",\n    \"> syncing clock... 03:14:07 UTC\", \"> mounting home directory... ok\");\n  return lines;\n}\n\nfunction buildProjectTree(projects) {\n  const lines = [\"projects/\"];\n  projects.forEach((p, i) => {\n    const last = i === projects.length - 1;\n    lines.push(`${last ? \"└──\" : \"├──\"} ${p.id}/  (${p.tagLabel})`);\n  });\n  lines.push(\"\", `> ${projects.length} projects loaded, 0 errors`);\n  return lines;\n}\n\nconst PROJECTS = [\n  { id: \"driftwake\", title: \"Driftwake\", tagLabel: \"game_dev\", category: \"games\", code: \"C++\", year: \"2025\", mediaCount: 4,\n    blurb: \"A 2D physics-driven sailing roguelike built solo in a custom engine.\",\n    subhead: \"A sailing roguelike where the sea is the opponent\",\n    long: \"Driftwake pairs a hand-rolled 2D fluid simulation with roguelike run structure: every voyage rewrites the wind, the currents and the wreckage you can salvage from. Built the engine, tools and ship-building UI from scratch over fourteen months.\",\n    stack: [\"C++20\", \"Godot 4\", \"Box2D\", \"GLSL\", \"Steamworks SDK\"], meta: \"Solo project · 2025\",\n    commits: [\"sim.step(wind_field, dt);\", \"hull.integrate_buoyancy();\", 'git commit -m \"storm finally reads right\"'] },\n  { id: \"ledgerline\", title: \"Ledgerline\", tagLabel: \"software\", category: \"software\", code: \"Rust\", year: \"2024\", mediaCount: 3,\n    blurb: \"Local-first accounting engine for freelancers, with a plain-text ledger format.\",\n    subhead: \"Accounting that lives in a text file you actually own\",\n    long: \"Ledgerline keeps a full double-entry ledger in a diffable plain-text format, syncing over git instead of a server. Built for freelancers who don't want their financial history locked in someone else's database.\",\n    stack: [\"Rust\", \"SQLite\", \"WASM\", \"CLI\"], meta: \"Solo project · 2024\",\n    commits: [\"ledger.reconcile(period);\", \"export.to_csv(fy2024);\", 'git commit -m \"closing balance finally ties out\"'] },\n  { id: \"nightshift\", title: \"Nightshift\", tagLabel: \"app_dev\", category: \"apps\", code: \"Swift\", year: \"2024\", mediaCount: 4,\n    blurb: \"An iOS app that schedules focus blocks around your actual calendar noise.\",\n    subhead: \"Focus time that survives contact with a real calendar\",\n    long: \"Nightshift reads your existing calendars, finds the gaps that are actually free, and negotiates focus blocks around meetings instead of ignoring them. Shipped solo, in the App Store since spring 2024.\",\n    stack: [\"Swift\", \"SwiftUI\", \"EventKit\", \"CloudKit\"], meta: \"Solo project · 2024\",\n    commits: [\"scheduler.resolve(conflicts);\", \"notif.schedule(quietHours);\", 'git commit -m \"stop double-booking lunch\"'] },\n  { id: \"marrow\", title: \"Marrow Press\", tagLabel: \"website\", category: \"web\", code: \"Next.js\", year: \"2023\", mediaCount: 3,\n    blurb: \"Storefront + CMS for a small independent publisher.\",\n    subhead: \"A storefront small enough for one editor to run alone\",\n    long: \"A combined storefront and lightweight CMS built for a two-person publishing house — inventory, preorders and blog posts all editable without touching code.\",\n    stack: [\"Next.js\", \"Sanity\", \"Stripe\", \"Vercel\"], meta: \"Client project · 2023\",\n    commits: [\"stripe.webhook(orderPaid);\", \"sanity.revalidate(post);\", 'git commit -m \"preorders finally count down\"'] }\n];\n\nclass Component extends DCLogic {\n  state = { typed: {}, accent: this.props.accent ?? \"green\", page: \"intro\", filter: \"all\", activeId: \"driftwake\", sent: false, mediaIndex: 0, lightboxSource: null,\n    introEntries: [], introTyping: \"\", introProjectIndex: 0, introDone: false, introMediaId: null, introMediaOpacity: 0 };\n  introToken = 0;\n  introLines = buildBootLog();\n  texts = {\n    heroPrompt: \"> whoami\",\n    heroTitle: \"Programmer, building across games, software, apps & the web.\",\n    workPrompt: \"> ls work/\",\n    workTitle: \"All work\",\n    aboutPrompt: \"> cat about.sh\",\n    aboutTitle: \"Ten years turning ideas into working software.\",\n    contactPrompt: \"> ./contact.sh --init\",\n    contactTitle: \"Let's build something.\"\n  };\n  observed = new Set();\n\n  setupShader(canvas) {\n    if (!canvas || this._gl) return;\n    canvas.width = 160; canvas.height = 90;\n    const gl = canvas.getContext(\"webgl\");\n    if (!gl) return;\n    this._gl = gl;\n    const vs = `attribute vec2 p; void main(){ gl_Position = vec4(p,0.0,1.0); }`;\n    const fs = `precision mediump float; uniform float uT; uniform vec2 uR; uniform vec3 uC;\n      void main(){\n        vec2 uv = gl_FragCoord.xy / uR;\n        float v = sin(uv.x*3.0+uT*0.12) + sin(uv.y*3.6-uT*0.1) + sin((uv.x+uv.y)*4.2+uT*0.08)\n          + sin(sqrt((uv.x-0.5)*(uv.x-0.5)+(uv.y-0.5)*(uv.y-0.5))*7.0-uT*0.15);\n        v = v*0.25+0.5;\n        gl_FragColor = vec4(uC*v, 1.0);\n      }`;\n    const compile = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };\n    const prog = gl.createProgram();\n    gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));\n    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));\n    gl.linkProgram(prog);\n    gl.useProgram(prog);\n    const buf = gl.createBuffer();\n    gl.bindBuffer(gl.ARRAY_BUFFER, buf);\n    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);\n    const loc = gl.getAttribLocation(prog, \"p\");\n    gl.enableVertexAttribArray(loc);\n    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);\n    this._uT = gl.getUniformLocation(prog, \"uT\");\n    this._uR = gl.getUniformLocation(prog, \"uR\");\n    this._uC = gl.getUniformLocation(prog, \"uC\");\n    gl.uniform2f(this._uR, canvas.width, canvas.height);\n    const hexToRgb = (hex) => { const n = parseInt(hex.slice(1), 16); return [((n>>16)&255)/255, ((n>>8)&255)/255, (n&255)/255]; };\n    const tick = (t) => {\n      if (!this._gl) return;\n      const [r,g,b] = hexToRgb(ACCENTS[this.state.accent]);\n      gl.uniform1f(this._uT, t / 1000);\n      gl.uniform3f(this._uC, r, g, b);\n      gl.viewport(0, 0, canvas.width, canvas.height);\n      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);\n      this._raf = requestAnimationFrame(tick);\n    };\n    this._raf = requestAnimationFrame(tick);\n  }\n\n  componentDidMount() {\n    this.syncBodyScroll();\n    if (this.state.page === \"intro\") this.startIntro();\n    else { this.typeKey(\"heroPrompt\"); this.typeKey(\"heroTitle\"); }\n  }\n\n  // intro.sh's animated 3D tilt can nudge the document's scrollable overflow\n  // by a sub-pixel amount each frame, flickering the native scrollbar — so\n  // page scroll is disabled only while intro.sh is showing, and restored for\n  // every other page (which may legitimately need to scroll).\n  syncBodyScroll() {\n    const hide = this.state.page === \"intro\";\n    document.documentElement.style.overflow = hide ? \"hidden\" : \"\";\n    document.body.style.overflow = hide ? \"hidden\" : \"\";\n  }\n\n  componentWillUnmount() {\n    if (this._raf) cancelAnimationFrame(this._raf);\n    this._gl = null;\n    this.introToken++;\n  }\n\n  componentDidUpdate() {\n    this.syncBodyScroll();\n    if (this.state.page === \"intro\") this.renderBootFrame();\n  }\n\n  // Boot-phase text is rendered to an offscreen 2D canvas, uploaded as a\n  // WebGL texture, and displaced by a real per-pixel fisheye shader — a\n  // true warp with none of the ghosting feDisplacementMap caused on live\n  // DOM text, since the rasterization is fully ours to control. Only used\n  // before the first project preview appears; once introDone, the log\n  // switches back to normal interactive DOM (image-slot previews, links).\n  setupBootCanvas(canvas) {\n    if (!canvas) { this._bootCanvas = null; return; }\n    // Re-run full setup whenever the canvas element identity changes (e.g.\n    // navigating home then back to intro.sh unmounts/remounts a new\n    // <canvas>) — the old guard only checked _bootGl, which stayed set to\n    // a context bound to the now-detached old canvas, so nothing drew.\n    if (this._bootGl && this._bootCanvas === canvas) return;\n    this._bootCanvas = canvas;\n    const gl = canvas.getContext(\"webgl\", { preserveDrawingBuffer: true });\n    if (!gl) return;\n    this._bootGl = gl;\n    const vs = `attribute vec2 p; varying vec2 vUv; void main(){ vUv = p*0.5+0.5; gl_Position = vec4(p,0.0,1.0); }`;\n    const fs = `precision mediump float; varying vec2 vUv; uniform sampler2D uTex; uniform float uK; uniform float uFadeStart;\n      void main(){\n        vec2 uv = vUv*2.0-1.0;\n        float r = length(uv);\n        vec2 uv2 = uv * (1.0 + uK*r*r*0.01);\n        uv2 = uv2*0.5+0.5;\n        vec4 bg = vec4(0.02,0.028,0.02,1.0);\n        vec4 texColor = bg;\n        if (uv2.x>=0.0 && uv2.x<=1.0 && uv2.y>=0.0 && uv2.y<=1.0) { texColor = texture2D(uTex, vec2(uv2.x, 1.0-uv2.y)); }\n        // Fades out toward the top of the canvas (vUv.y approaches 1),\n        // so scrolled-off text dissolves instead of hard-clipping. uFadeStart\n        // (tweakable) sets where the dissolve begins.\n        float fadeTop = smoothstep(1.0, uFadeStart, vUv.y);\n        fadeTop = pow(fadeTop, 1.6);\n        gl_FragColor = mix(bg, texColor, fadeTop);\n      }`;\n    const compile = (t, s) => { const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh); return sh; };\n    const prog = gl.createProgram();\n    gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));\n    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));\n    gl.linkProgram(prog);\n    gl.useProgram(prog);\n    const buf = gl.createBuffer();\n    gl.bindBuffer(gl.ARRAY_BUFFER, buf);\n    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);\n    const loc = gl.getAttribLocation(prog, \"p\");\n    gl.enableVertexAttribArray(loc);\n    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);\n    this._bootUK = gl.getUniformLocation(prog, \"uK\");\n    this._bootUFade = gl.getUniformLocation(prog, \"uFadeStart\");\n    const tex = gl.createTexture();\n    gl.bindTexture(gl.TEXTURE_2D, tex);\n    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);\n    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);\n    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);\n    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);\n    this._bootTex = tex;\n    this._textCanvas = document.createElement(\"canvas\");\n    this.renderBootFrame();\n  }\n\n  renderBootFrame() {\n    const canvas = this._bootCanvas, gl = this._bootGl;\n    if (!canvas || !gl) return;\n    const dpr = Math.min(2, window.devicePixelRatio || 1);\n    const rect = canvas.getBoundingClientRect();\n    const w = Math.max(1, Math.round(rect.width * dpr)), h = Math.max(1, Math.round(rect.height * dpr));\n    if (!w || !h) return;\n    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }\n    const tc = this._textCanvas;\n    tc.width = w; tc.height = h;\n    const tctx = tc.getContext(\"2d\");\n    tctx.fillStyle = \"#050705\"; tctx.fillRect(0, 0, w, h);\n    const acc = ACCENTS[this.state.accent] || ACCENTS.green;\n    const fontSize = 12.5 * dpr;\n    const lineHeight = fontSize * 1.55;\n    const colW = Math.min(w - 40 * dpr, 880 * dpr);\n    const padX = (w - colW) / 2;\n    tctx.textBaseline = \"top\";\n\n    const wrap = (text, maxW, size) => {\n      tctx.font = `${size}px 'JetBrains Mono', monospace`;\n      const words = text.split(\" \"); const out = []; let cur = \"\";\n      for (const word of words) {\n        const test = cur ? cur + \" \" + word : word;\n        if (tctx.measureText(test).width > maxW && cur) { out.push(cur); cur = word; } else cur = test;\n      }\n      if (cur) out.push(cur);\n      return out;\n    };\n\n    // Build a flat list of drawable blocks (measured bottom-up) so text\n    // lines and project-preview \"cards\" share one continuous, auto-scrolling\n    // column — the whole loop lives on canvas now, not just the boot text.\n    const blocks = [];\n    for (const entry of this.state.introEntries) {\n      if (entry.isLine) {\n        blocks.push({ h: lineHeight, draw: (y) => { tctx.font = `${fontSize}px 'JetBrains Mono', monospace`; tctx.fillStyle = acc; tctx.fillText(entry.text, padX, y); } });\n      } else if (entry.isPreview) {\n        const boxH = colW * (this.props.previewBoxRatio ?? 0.625);\n        const blurbLines = wrap(entry.blurb, colW - 28 * dpr, 12.5 * dpr);\n        const cardH = 20 * dpr + 22 * dpr + 4 * dpr + 18 * dpr + 8 * dpr + blurbLines.length * 18 * dpr + 8 * dpr + 16 * dpr + 14 * dpr;\n        blocks.push({\n          h: boxH + 6 * dpr + cardH + 10 * dpr,\n          draw: (y) => {\n            tctx.strokeStyle = \"rgba(150,255,190,0.4)\"; tctx.lineWidth = dpr;\n            tctx.strokeRect(padX, y, colW, boxH);\n            tctx.fillStyle = \"rgba(150,255,190,0.7)\";\n            tctx.font = `${12 * dpr}px 'JetBrains Mono', monospace`;\n            tctx.textAlign = \"center\";\n            tctx.fillText(\"[ project preview ]\", padX + colW / 2, y + boxH / 2 - 8 * dpr);\n            tctx.font = `${11 * dpr}px 'JetBrains Mono', monospace`;\n            tctx.fillText(\"or browse files\", padX + colW / 2, y + boxH / 2 + 12 * dpr);\n            tctx.textAlign = \"left\";\n            let cy = y + boxH + 6 * dpr;\n            tctx.strokeStyle = \"rgba(150,255,190,0.5)\";\n            tctx.strokeRect(padX, cy, colW, cardH);\n            cy += 14 * dpr;\n            tctx.fillStyle = acc; tctx.font = `bold ${14 * dpr}px 'JetBrains Mono', monospace`;\n            tctx.fillText(entry.title, padX + 14 * dpr, cy); cy += 22 * dpr;\n            tctx.fillStyle = \"rgba(150,255,190,0.75)\"; tctx.font = `${12 * dpr}px 'JetBrains Mono', monospace`;\n            tctx.fillText(entry.tagline, padX + 14 * dpr, cy); cy += 22 * dpr;\n            tctx.fillStyle = acc; tctx.font = `${12.5 * dpr}px 'JetBrains Mono', monospace`;\n            blurbLines.forEach(l => { tctx.fillText(l, padX + 14 * dpr, cy); cy += 18 * dpr; });\n            cy += 8 * dpr;\n            tctx.fillStyle = \"rgba(150,255,190,0.6)\"; tctx.font = `${11.5 * dpr}px 'JetBrains Mono', monospace`;\n            tctx.fillText(entry.stackLine, padX + 14 * dpr, cy);\n          }\n        });\n      }\n    }\n    if (this.state.introTyping) blocks.push({ h: lineHeight, draw: (y) => { tctx.font = `${fontSize}px 'JetBrains Mono', monospace`; tctx.fillStyle = acc; tctx.fillText(this.state.introTyping + \"_\", padX, y); } });\n\n    let y = h - 40 * dpr;\n    for (let i = blocks.length - 1; i >= 0 && y > -200 * dpr; i--) {\n      y -= blocks[i].h;\n      if (y < h) blocks[i].draw(y);\n    }\n\n    gl.viewport(0, 0, w, h);\n    gl.bindTexture(gl.TEXTURE_2D, this._bootTex);\n    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, tc);\n    gl.uniform1f(this._bootUK, this.props.fisheyeIntensity ?? 32);\n    gl.uniform1f(this._bootUFade, this.props.fadeTopStart ?? 0.42);\n    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);\n  }\n\n  appendLine(text) {\n    this.setState(s => ({ introEntries: [...s.introEntries, { isLine: true, isCard: false, text }].slice(-30) }));\n  }\n\n  // Replaces the last log entry in place (used to animate a single\n  // progress-bar line rather than flooding the log with one line per tick).\n  updateLastLine(text) {\n    this.setState(s => {\n      const entries = s.introEntries.slice();\n      if (entries.length && entries[entries.length - 1].isLine) entries[entries.length - 1] = { isLine: true, isCard: false, text };\n      else entries.push({ isLine: true, isCard: false, text });\n      return { introEntries: entries };\n    });\n  }\n\n  runAssetProgress(label, cb) {\n    const token = this.introToken;\n    const width = 22, steps = 28;\n    let i = 0;\n    this.appendLine(\"\");\n    const tick = () => {\n      if (this.introToken !== token) return;\n      const pct = Math.min(100, Math.round((i / steps) * 100));\n      const filled = Math.round((pct / 100) * width);\n      const bar = \"=\".repeat(filled) + \" \".repeat(width - filled);\n      this.updateLastLine(`> loading assets: ${label} [${bar}] ${String(pct).padStart(3, \" \")}%`);\n      if (i >= steps) { setTimeout(cb, 200); return; }\n      i++;\n      setTimeout(tick, 45 + Math.random() * 30);\n    };\n    tick();\n  }\n\n  appendPreview(proj, mediaId) {\n    this.setState(s => ({ introEntries: [...s.introEntries, {\n      isLine: false, isPreview: true, mediaId, title: proj.title.toUpperCase(),\n      tagline: `${proj.tagLabel} · ${proj.code} · ${proj.year}`, blurb: proj.blurb,\n      stackLine: \"stack: \" + proj.stack.slice(0, 3).join(\", \")\n    }].slice(-12) }));\n  }\n\n  typeLine(text, cb) {\n    const token = this.introToken;\n    let i = 0;\n    this.setState({ introTyping: \"\" });\n    const step = () => {\n      if (this.introToken !== token) return;\n      i++;\n      this.setState({ introTyping: text.slice(0, i) });\n      if (i < text.length) { setTimeout(step, 14 + Math.random() * 18); return; }\n      this.appendLine(text);\n      this.setState({ introTyping: \"\" });\n      setTimeout(() => { if (this.introToken === token) cb(); }, 200);\n    };\n    setTimeout(step, 90);\n  }\n\n  startIntro() {\n    const token = ++this.introToken;\n    const alive = () => this.introToken === token;\n    this.setState({ introEntries: [], introTyping: \"\", introProjectIndex: 0, introDone: false });\n\n    const bootIdx = { i: 0 };\n    const floodBoot = () => {\n      if (!alive()) return;\n      if (bootIdx.i >= this.introLines.length) { setTimeout(() => runTree(() => runPreviewStep(this.state.introProjectIndex, 0)), 400); return; }\n      // Flood-print: real boot logs dump instantly, not character-by-character —\n      // batch a few lines per frame so ~500 lines flash by fast instead of\n      // taking minutes via the typewriter effect used elsewhere.\n      const batch = 6;\n      for (let n = 0; n < batch && bootIdx.i < this.introLines.length; n++, bootIdx.i++) {\n        this.appendLine(this.introLines[bootIdx.i]);\n      }\n      setTimeout(floodBoot, 12);\n    };\n\n    // The project listing is a typed command (\"$ list projects\") followed\n    // by a fast-flooded ascii tree of every project — shown before loading\n    // begins, and again each time a project's preview finishes.\n    const runTree = (next) => {\n      if (!alive()) return;\n      this.typeLine(\"$ list projects\", () => {\n        const treeLines = buildProjectTree(PROJECTS);\n        let ti = 0;\n        const floodTree = () => {\n          if (!alive()) return;\n          if (ti >= treeLines.length) { setTimeout(next, 350); return; }\n          this.appendLine(treeLines[ti]); ti++;\n          setTimeout(floodTree, 55);\n        };\n        floodTree();\n      });\n    };\n    // The very first line still types out character-by-character so the\n    // boot-up itself is visibly \"typed\" before the log floods fast.\n    const runBootLine = () => {\n      if (!alive()) return;\n      this.typeLine(this.introLines[0], () => { bootIdx.i = 1; floodBoot(); });\n    };\n\n    const runPreviewStep = (projIdx, mediaIdx) => {\n      if (!alive()) return;\n      const proj = PROJECTS[projIdx];\n      if (mediaIdx === 0) {\n        this.typeLine(`$ load ${proj.id}`, () => {\n          this.runAssetProgress(proj.id, () => runPreviewFrame(projIdx, mediaIdx));\n        });\n        return;\n      }\n      runPreviewFrame(projIdx, mediaIdx);\n    };\n\n    const runPreviewFrame = (projIdx, mediaIdx) => {\n      if (!alive()) return;\n      const proj = PROJECTS[projIdx];\n      const mediaCount = proj.mediaCount || 1;\n      this.typeLine(`$ preview ${proj.id} --frame ${mediaIdx + 1}`, () => {\n        this.appendPreview(proj, `intro-preview-${proj.id}-${mediaIdx}`);\n        this.setState({ introDone: true });\n        setTimeout(() => {\n          if (!alive()) return;\n          let nextMedia = mediaIdx + 1, nextProj = projIdx;\n          if (nextMedia >= mediaCount) {\n            nextMedia = 0; nextProj = projIdx + 1;\n            if (nextProj >= PROJECTS.length) { runClearAndLoop(); return; }\n            this.setState({ introProjectIndex: nextProj });\n            runTree(() => runPreviewStep(nextProj, nextMedia));\n            return;\n          }\n          this.setState({ introProjectIndex: nextProj });\n          runPreviewStep(nextProj, nextMedia);\n        }, this.props.introIntervalMs ?? 2100);\n      });\n    };\n\n    const runClearAndLoop = () => {\n      if (!alive()) return;\n      this.typeLine(\"$ clear\", () => {\n        setTimeout(() => {\n          if (!alive()) return;\n          this.setState({ introEntries: [], introProjectIndex: 0 });\n          bootIdx.i = 0;\n          runBootLine();\n        }, 400);\n      });\n    };\n\n    setTimeout(runBootLine, 150);\n  }\n\n  typeKey(key, textOverride) {\n    const full = textOverride ?? this.texts[key];\n    this.typeTokens = this.typeTokens || {};\n    const token = (this.typeTokens[key] = (this.typeTokens[key] || 0) + 1);\n    this.setState(s => ({ typed: { ...s.typed, [key]: \"\" } }));\n    let i = 0;\n    const step = () => {\n      if (this.typeTokens[key] !== token) return;\n      i++;\n      this.setState(s => ({ typed: { ...s.typed, [key]: full.slice(0, i) } }));\n      if (i < full.length) setTimeout(step, 26 + Math.random() * 34);\n    };\n    setTimeout(step, 30);\n  }\n\n  makeRef(key) {\n    return (el) => { /* refs kept for potential future use; typing is now nav-triggered */ };\n  }\n\n  navigate(page) {\n    if (page !== \"intro\") this.introToken++;\n    this.setState({ page });\n    if (page === \"home\") { this.typeKey(\"heroPrompt\"); this.typeKey(\"heroTitle\"); }\n    if (page === \"work\") { this.typeKey(\"workPrompt\"); this.typeKey(\"workTitle\"); }\n    if (page === \"about\") { this.typeKey(\"aboutPrompt\"); this.typeKey(\"aboutTitle\"); }\n    if (page === \"contact\") { this.typeKey(\"contactPrompt\"); this.typeKey(\"contactTitle\"); this.setState({ sent: false }); }\n  }\n\n  openProject(id) {\n    const proj = PROJECTS.find(p => p.id === id);\n    this.setState({ page: \"detail\", activeId: id, mediaIndex: 0 });\n    this.typeKey(\"detailPrompt\", `> cat ${id}/readme.md`);\n    this.typeKey(\"detailTitle\", proj.title);\n  }\n\n  stepMedia(dir) {\n    const active = PROJECTS.find(p => p.id === this.state.activeId) || PROJECTS[0];\n    const count = active.mediaCount || 1;\n    this.setState(s => ({ mediaIndex: (s.mediaIndex + dir + count) % count }));\n  }\n\n  openLightbox(id) { this.setState({ lightboxSource: { type: \"static\", id } }); }\n  openDetailLightbox() { this.setState({ lightboxSource: { type: \"detail\" } }); }\n  closeLightbox() { this.setState({ lightboxSource: null }); }\n\n  trackZoomIcon(e) {\n    const icon = e.currentTarget.querySelector(\".zoom-icon\");\n    if (!icon) return;\n    const r = e.currentTarget.getBoundingClientRect();\n    icon.style.left = (e.clientX - r.left) + \"px\";\n    icon.style.top = (e.clientY - r.top) + \"px\";\n  }\n\n  renderVals() {\n    const t = this.state.typed;\n    const accents = [\"green\", \"amber\", \"cyan\"];\n    const active = PROJECTS.find(p => p.id === this.state.activeId) || PROJECTS[0];\n    const withOpen = (p, previewPrefix) => ({\n      ...p, onOpen: () => this.openProject(p.id),\n      onOpenPreview: (e) => { e.stopPropagation(); this.openLightbox(`${previewPrefix}-${p.id}`); }\n    });\n    const featured = PROJECTS.slice(0, 3).map(p => withOpen(p, \"home-preview\"));\n    const filterDefs = [\n      { key: \"all\", label: \"all\" }, { key: \"games\", label: \"games\" }, { key: \"software\", label: \"software\" },\n      { key: \"apps\", label: \"apps\" }, { key: \"web\", label: \"web\" }\n    ];\n    const filters = filterDefs.map(f => ({\n      label: f.label, className: \"term-tag\" + (this.state.filter === f.key ? \" solid\" : \"\"),\n      onClick: () => this.setState({ filter: f.key })\n    }));\n    const visibleProjects = (this.state.filter === \"all\" ? PROJECTS : PROJECTS.filter(p => p.category === this.state.filter)).map(p => withOpen(p, \"work-preview\"));\n    const skillRows = [\n      { a: \"C++\", b: \"Godot\", c: \"Docker\" }, { a: \"Rust\", b: \"React\", c: \"Postgres\" },\n      { a: \"Swift\", b: \"SwiftUI\", c: \"CloudKit\" }, { a: \"TypeScript\", b: \"Next.js\", c: \"WASM\" }\n    ];\n\n    return {\n      rootStyle: { \"--acc\": ACCENTS[this.state.accent], position: \"relative\", color: \"#d8ffe6\", minHeight: \"100vh\" },\n      scanClass: this.props.scanlines === false ? \"\" : \"scan\",\n      canvasRef: (el) => this.setupShader(el),\n      toggleAccent: () => this.setState(s => ({ accent: accents[(accents.indexOf(s.accent) + 1) % accents.length] })),\n      accentLabel: \"accent: \" + this.state.accent,\n\n      isIntro: this.state.page === \"intro\", isMain: this.state.page !== \"intro\",\n      introOffsetX: this.props.introOffsetX ?? 0, introOffsetY: this.props.introOffsetY ?? 0,\n      bootCanvasRef: (el) => { this.setupBootCanvas(el); },\n      introEntries: this.state.introEntries, introTyping: this.state.introTyping, introDone: this.state.introDone,\n      isHome: this.state.page === \"home\", isWork: this.state.page === \"work\",\n      isDetail: this.state.page === \"detail\", isAbout: this.state.page === \"about\", isContact: this.state.page === \"contact\",\n      homeTabClass: \"term-tab\" + (this.state.page === \"home\" ? \" active\" : \"\"),\n      workTabClass: \"term-tab\" + ([\"work\",\"detail\"].includes(this.state.page) ? \" active\" : \"\"),\n      aboutTabClass: \"term-tab\" + (this.state.page === \"about\" ? \" active\" : \"\"),\n      contactTabClass: \"term-tab\" + (this.state.page === \"contact\" ? \" active\" : \"\"),\n      goHome: () => this.navigate(\"home\"), goWork: () => this.navigate(\"work\"),\n      goIntro: () => { this.setState({ page: \"intro\" }); this.startIntro(); },\n      goAbout: () => this.navigate(\"about\"), goContact: () => this.navigate(\"contact\"),\n\n      heroPromptRef: this.makeRef(\"heroPrompt\"), heroTitleRef: this.makeRef(\"heroTitle\"),\n      heroPromptText: t.heroPrompt ?? \"\", heroTitleText: t.heroTitle ?? \"\",\n      heroPromptFinal: this.texts.heroPrompt, heroTitleFinal: this.texts.heroTitle,\n      workPromptText: t.workPrompt ?? \"\", workTitleText: t.workTitle ?? \"\",\n      workPromptFinal: this.texts.workPrompt, workTitleFinal: this.texts.workTitle,\n      aboutPromptRef: this.makeRef(\"aboutPrompt\"), aboutTitleRef: this.makeRef(\"aboutTitle\"),\n      aboutPromptText: t.aboutPrompt ?? \"\", aboutTitleText: t.aboutTitle ?? \"\",\n      aboutPromptFinal: this.texts.aboutPrompt, aboutTitleFinal: this.texts.aboutTitle,\n      contactPromptRef: this.makeRef(\"contactPrompt\"), contactTitleRef: this.makeRef(\"contactTitle\"),\n      contactPromptText: t.contactPrompt ?? \"\", contactTitleText: t.contactTitle ?? \"\",\n      contactPromptFinal: this.texts.contactPrompt, contactTitleFinal: this.texts.contactTitle,\n      detailPromptRef: this.makeRef(\"detailPrompt\"), detailTitleRef: this.makeRef(\"detailTitle\"),\n      detailPromptText: t.detailPrompt ?? \"\", detailTitleText: t.detailTitle ?? \"\",\n      detailPromptFinal: `> cat ${this.state.activeId}/readme.md`, detailTitleFinal: active.title,\n\n      featured, filters, visibleProjects, skillRows,\n      visibleCountLabel: visibleProjects.length + \" project\" + (visibleProjects.length === 1 ? \"\" : \"s\"),\n      active: { ...active, stackTop: active.stack.slice(0, 2) },\n      mediaIndex: this.state.mediaIndex,\n      mediaLabel: String(this.state.mediaIndex + 1).padStart(2, \"0\") + \" / \" + String(active.mediaCount || 1).padStart(2, \"0\"),\n      prevMediaClick: (e) => { e.stopPropagation(); this.stepMedia(-1); },\n      nextMediaClick: (e) => { e.stopPropagation(); this.stepMedia(1); },\n      openDetailLightbox: () => this.openDetailLightbox(),\n      trackZoomIcon: (e) => this.trackZoomIcon(e),\n      lightboxOpen: !!this.state.lightboxSource,\n      lightboxShowNav: this.state.lightboxSource?.type === \"detail\",\n      lightboxId: !this.state.lightboxSource ? null\n        : this.state.lightboxSource.type === \"detail\" ? `detail-photo-${active.id}-${this.state.mediaIndex}`\n        : this.state.lightboxSource.id,\n      closeLightbox: () => this.closeLightbox(),\n\n      handleSend: () => this.setState({ sent: true }),\n      sendLabel: this.state.sent ? \"sent ✓\" : \"./send.sh\"\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
