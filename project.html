<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting… — A.Voss</title>
<script>
  // Keep legacy project links working with Journey V2's project ID rules.
  (function () {
    var params = new URLSearchParams(window.location.search);
    var id = params.get('id');
    var isSafeId = typeof id === 'string' && /^[a-z0-9_-]+$/i.test(id);
    var dest = isSafeId
      ? './index.html#project=' + encodeURIComponent(id)
      : './index.html#projects';
    window.location.replace(dest);
  })();
</script>
</head>
<body>
  <p style="font-family:ui-monospace,monospace;color:#9fd9b8;background:#050705;padding:40px;">
    Redirecting to <a href="./index.html" style="color:#33ff99;">the new project page</a>…
  </p>
</body>
</html>
