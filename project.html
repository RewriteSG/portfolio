<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting… — A.Voss</title>
<script>
  // Legacy link support: project.html?id=X now lives at index.html#/work/X
  // inside the single-page app. Preserve the id and forward immediately.
  (function () {
    var params = new URLSearchParams(window.location.search);
    var id = params.get('id');
    var dest = id ? './index.html#/project/' + encodeURIComponent(id) : './index.html#/work';
    window.location.replace(dest);
  })();
</script>
</head>
<body>
  <p style="font-family:ui-monospace,monospace;color:#9fd9b8;background:#050705;padding:40px;">
    Redirecting to <a href="./index.html" style="color:#33ff99;">the new project page</a>…
  </p>
</body>
</html>
